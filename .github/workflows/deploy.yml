# ========================================
# Deploy OpenGym — SSH-First (mirrors mazaya)
# Strategy: Build happens in GitHub CI (off-server)
# Server only pulls the finished image and restarts.
# ========================================
name: Deploy to Server

on:
  workflow_run:
    workflows: ["Build & Push to GHCR"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Debug secrets (masked)
        run: |
          echo "SSH_HOST: ${{ secrets.SSH_HOST }}"
          echo "SSH_USER: ${{ secrets.SSH_USER }}"
          echo "SH_PRIVATE_KEY length: ${{ secrets.SH_PRIVATE_KEY }} chars (count placeholder)"
          SH_KEY="${{ secrets.SH_PRIVATE_KEY }}"
          echo "SH_PRIVATE_KEY first line: $(echo "$SH_KEY" | head -1)"
          echo "SH_PRIVATE_KEY last line:  $(echo "$SH_KEY" | tail -1)"
          echo "SH_PRIVATE_KEY line count: $(echo "$SH_KEY" | wc -l)"

      - name: Validate private key locally
        run: |
          SH_KEY="${{ secrets.SH_PRIVATE_KEY }}"
          echo "$SH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          echo "--- Key file head ---"
          head -1 /tmp/deploy_key
          echo "--- Key file tail ---"
          tail -1 /tmp/deploy_key
          echo "--- ssh-keygen -l (fingerprint) ---"
          ssh-keygen -l -f /tmp/deploy_key || echo "INVALID KEY FORMAT"
          echo "--- key type ---"
          head -1 /tmp/deploy_key

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e

            GHCR_IMAGE="ghcr.io/momarzouk1998/open_gym:latest"
            LOCAL_TAG="opengym:latest"

            echo "=== [1/6] Pulling image from GHCR ==="
            docker pull $GHCR_IMAGE

            echo "=== [2/6] Tagging local image ==="
            docker tag $GHCR_IMAGE $LOCAL_TAG

            echo "=== [3/6] Stopping old container ==="
            docker stop opengym 2>/dev/null || true
            docker rm opengym 2>/dev/null || true

            echo "=== [4/6] Starting new container ==="
            docker run -d \
              --name opengym \
              --restart unless-stopped \
              --network host \
              --env-file /opt/openappo-gym/.env \
              $LOCAL_TAG

            echo "=== [5/6] Waiting 15s for startup ==="
            sleep 15

            echo "=== Container status ==="
            docker ps --filter name=opengym
            docker logs opengym --tail 20

            echo ""
            echo "=== Internal health check ==="
            curl -s -o /dev/null -w "HTTP: %{http_code} | Time: %{time_total}s\n" http://127.0.0.1:3000/ || echo "Internal check failed"

            echo "=== External health check ==="
            curl -s -o /dev/null -w "HTTP: %{http_code} | Time: %{time_total}s\n" https://opengym.openappo.com/ || echo "External check failed"

            echo "=== [6/6] Cleaning up old images ==="
            docker image prune -f

            echo ""
            echo "=== Deployment complete ==="
