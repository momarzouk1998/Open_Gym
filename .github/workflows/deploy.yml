# Deploy OpenGym — SSH-First Approach (mirrors mazaya)
# Strategy: Build happens in GitHub CI (off-server)
# Server only pulls the finished image and restarts.
# Uses raw SSH (not appleboy) for maximum control over key handling.

name: Deploy to Server

on:
  workflow_run:
    workflows: ["Build & Push to GHCR"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: root
        run: |
          # 1. Write key — strip Windows \r, ensure trailing newline
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          # 2. Diagnostics (safe — only fingerprint, no key leak)
          echo "=== Key diagnostics ==="
          echo "Bytes: $(wc -c < /tmp/deploy_key)"
          echo "Lines: $(wc -l < /tmp/deploy_key)"
          ssh-keygen -lf /tmp/deploy_key 2>&1 || { echo "INVALID KEY FILE"; exit 1; }
          echo "Source IP: $(curl -s https://api.ipify.org)"

          # 3. Accept server host key
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # 4. Test connection first (verbose)
          echo ""
          echo "=== Target SSH Host ==="
          echo "$SSH_HOST" | sed 's/./& /g'
          echo "=== Testing SSH connection ==="
          ssh -v -i /tmp/deploy_key -o ConnectTimeout=10 \
              -o StrictHostKeyChecking=accept-new \
              "$SSH_USER@$SSH_HOST" "echo CONNECTION_OK; whoami" 2>&1

          # 5. Deploy
          echo ""
          echo "=== Starting deployment ==="
          ssh -i /tmp/deploy_key -o ConnectTimeout=30 \
              "$SSH_USER@$SSH_HOST" << 'DEPLOY_SCRIPT'
          set -e

          GHCR_IMAGE="ghcr.io/momarzouk1998/open_gym:latest"
          LOCAL_TAG="opengym:latest"

          echo "=== [1/6] Pulling image from GHCR ==="
          docker pull $GHCR_IMAGE

          echo "=== [2/6] Tagging local image ==="
          docker tag $GHCR_IMAGE $LOCAL_TAG

          echo "=== [3/6] Stopping old container ==="
          docker stop opengym 2>/dev/null || true
          docker rm opengym 2>/dev/null || true

          echo "=== [4/6] Starting new container ==="
          docker run -d \
            --name opengym \
            --restart unless-stopped \
            --network host \
            --env-file /opt/openappo-gym/.env \
            $LOCAL_TAG

          echo "=== [5/6] Waiting 15s for startup ==="
          sleep 15

          echo "=== Container status ==="
          docker ps --filter name=opengym
          docker logs opengym --tail 20

          echo ""
          echo "=== Internal health check ==="
          curl -s -o /dev/null -w "HTTP: %{http_code} | Time: %{time_total}s\n" http://127.0.0.1:3000/ || echo "Internal check failed"

          echo "=== External health check ==="
          curl -s -o /dev/null -w "HTTP: %{http_code} | Time: %{time_total}s\n" https://opengym.openappo.com/ || echo "External health check failed"

          echo "=== [6/6] Cleaning up old images ==="
          docker image prune -f

          echo ""
          echo "=== Deployment complete ==="
          DEPLOY_SCRIPT

          # 6. Cleanup key
          rm -f /tmp/deploy_key

