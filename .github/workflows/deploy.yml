# ========================================
# Deploy OpenGym — SSH-First (mirrors mazaya)
# Strategy: Build happens in GitHub CI (off-server)
# Server only pulls the finished image and restarts.
# ========================================
name: Deploy to Server

on:
  workflow_run:
    workflows: ["Build & Push to GHCR"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Debug key shape (safe — only fingerprint via real ssh-keygen)
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Write to file and test with ssh-keygen (the only reliable way for private keys)
          printf '%s\n' "$SSH_KEY" > /tmp/key
          chmod 600 /tmp/key
          echo "Length (with newline): $(wc -c < /tmp/key) bytes"
          echo "Lines: $(wc -l < /tmp/key)"
          echo "Fingerprint: $(ssh-keygen -lf /tmp/key 2>&1)"
          echo "Corresponding public key:"
          ssh-keygen -yf /tmp/key 2>&1 | head -c 60
          echo "..."

      - name: Test SSH connection (real test, not appleboy)
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          printf '%s\n' "$SSH_KEY" > /tmp/key
          chmod 600 /tmp/key
          mkdir -p ~/.ssh && ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "=== Key fingerprint ==="
          ssh-keygen -lf /tmp/key
          echo "=== Source IP we're connecting from ==="
          curl -s https://api.ipify.org; echo
          echo "=== Trying real ssh with verbose output ==="
          ssh -v -i /tmp/key -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" "echo CONNECTION_OK; whoami; hostname" 2>&1 | tail -40

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e

            GHCR_IMAGE="ghcr.io/momarzouk1998/open_gym:latest"
            LOCAL_TAG="opengym:latest"

            echo "=== [1/6] Pulling image from GHCR ==="
            docker pull $GHCR_IMAGE

            echo "=== [2/6] Tagging local image ==="
            docker tag $GHCR_IMAGE $LOCAL_TAG

            echo "=== [3/6] Stopping old container ==="
            docker stop opengym 2>/dev/null || true
            docker rm opengym 2>/dev/null || true

            echo "=== [4/6] Starting new container ==="
            docker run -d \
              --name opengym \
              --restart unless-stopped \
              --network host \
              --env-file /opt/openappo-gym/.env \
              $LOCAL_TAG

            echo "=== [5/6] Waiting 15s for startup ==="
            sleep 15

            echo "=== Container status ==="
            docker ps --filter name=opengym
            docker logs opengym --tail 20

            echo ""
            echo "=== Internal health check ==="
            curl -s -o /dev/null -w "HTTP: %{http_code} | Time: %{time_total}s\n" http://127.0.0.1:3000/ || echo "Internal check failed"

            echo "=== External health check ==="
            curl -s -o /dev/null -w "HTTP: %{http_code} | Time: %{time_total}s\n" https://opengym.openappo.com/ || echo "External health check failed"

            echo "=== [6/6] Cleaning up old images ==="
            docker image prune -f

            echo ""
            echo "=== Deployment complete ==="
